# Free GitHub Dependabot: opens a pull request when a dependency has a security fix.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Skip major-version jumps (they can break the site); security fixes still come through.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
