<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#e6efff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#b8cfff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b8cfff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eef3ff"/>
      <stop offset="100%" stop-color="#cfdcff"/>
    </radialGradient>
  </defs>
  <!-- outer glow -->
  <circle cx="120" cy="120" r="110" fill="url(#moonGlow)"/>
  <!-- moon body -->
  <circle cx="120" cy="120" r="42" fill="url(#moonBody)"/>
  <!-- faint craters -->
  <g fill="#cfdcff" opacity="0.5">
    <circle cx="108" cy="110" r="3"/>
    <circle cx="132" cy="124" r="4"/>
    <circle cx="118" cy="138" r="2.5"/>
  </g>
</svg>
