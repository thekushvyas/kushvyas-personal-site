<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMin slice" width="1440" height="320">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#cfe0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9bbcff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bigHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#e6efff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#a8c4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a8c4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft halos (subtle glow clouds) -->
  <g>
    <circle cx="250"  cy="55"  r="40" fill="url(#bigHalo)"/>
    <circle cx="790"  cy="70"  r="46" fill="url(#bigHalo)"/>
    <circle cx="1230" cy="48"  r="38" fill="url(#bigHalo)"/>
    <circle cx="120"  cy="180" r="28" fill="url(#bigHalo)"/>
    <circle cx="1080" cy="190" r="30" fill="url(#bigHalo)"/>
  </g>

  <!-- mid halos -->
  <g>
    <circle cx="370"  cy="120" r="18" fill="url(#halo)"/>
    <circle cx="520"  cy="100" r="20" fill="url(#halo)"/>
    <circle cx="680"  cy="86"  r="16" fill="url(#halo)"/>
    <circle cx="910"  cy="96"  r="18" fill="url(#halo)"/>
    <circle cx="980"  cy="60"  r="18" fill="url(#halo)"/>
    <circle cx="60"   cy="40"  r="16" fill="url(#halo)"/>
    <circle cx="210"  cy="30"  r="14" fill="url(#halo)"/>
    <circle cx="1410" cy="44"  r="16" fill="url(#halo)"/>
    <circle cx="1360" cy="160" r="14" fill="url(#halo)"/>
    <circle cx="600"  cy="220" r="14" fill="url(#halo)"/>
    <circle cx="860"  cy="240" r="12" fill="url(#halo)"/>
  </g>

  <!-- bright cores -->
  <g fill="#ffffff">
    <circle cx="250"  cy="55"  r="2.6"/>
    <circle cx="790"  cy="70"  r="2.8"/>
    <circle cx="1230" cy="48"  r="2.4"/>
    <circle cx="120"  cy="180" r="1.8"/>
    <circle cx="1080" cy="190" r="2"/>
    <circle cx="370"  cy="120" r="1.6"/>
    <circle cx="520"  cy="100" r="2"/>
    <circle cx="680"  cy="86"  r="1.4"/>
    <circle cx="910"  cy="96"  r="1.6"/>
    <circle cx="980"  cy="60"  r="1.8"/>
    <circle cx="60"   cy="40"  r="1.6"/>
    <circle cx="210"  cy="30"  r="1.4"/>
    <circle cx="1410" cy="44"  r="1.6"/>
    <circle cx="1360" cy="160" r="1.3"/>
    <circle cx="600"  cy="220" r="1.4"/>
    <circle cx="860"  cy="240" r="1.2"/>
  </g>

  <!-- tiny background stars (no halo) for organic density -->
  <g fill="#cfe0ff">
    <circle cx="100"  cy="90"  r="1"/>
    <circle cx="170"  cy="140" r="0.9"/>
    <circle cx="320"  cy="180" r="1"/>
    <circle cx="430"  cy="60"  r="0.9"/>
    <circle cx="560"  cy="160" r="1"/>
    <circle cx="740"  cy="200" r="0.9"/>
    <circle cx="820"  cy="40"  r="1.1"/>
    <circle cx="1020" cy="110" r="0.9"/>
    <circle cx="1140" cy="50"  r="1"/>
    <circle cx="1190" cy="160" r="0.9"/>
    <circle cx="1300" cy="100" r="1"/>
    <circle cx="1320" cy="220" r="0.9"/>
  </g>

  <!-- four-point sparkles on a couple of feature stars -->
  <g stroke="#dfeaff" stroke-width="1" stroke-linecap="round" opacity="0.85">
    <path d="M250,55 v-22 M250,55 v22 M250,55 h-22 M250,55 h22"/>
    <path d="M790,70 v-26 M790,70 v26 M790,70 h-26 M790,70 h26"/>
    <path d="M1230,48 v-20 M1230,48 v20 M1230,48 h-20 M1230,48 h20"/>
  </g>
</svg>
